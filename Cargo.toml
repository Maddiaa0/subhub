[package]
name = "subhub"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Route Claude Code and Codex through available subscription accounts"
license = "MIT"
repository = "https://github.com/Maddiaa0/subhub"
homepage = "https://github.com/Maddiaa0/subhub"
documentation = "https://docs.rs/subhub"
readme = "README.md"
keywords = ["claude", "oauth", "credentials", "subscription", "proxy"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
axum = "0.8"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
toml_edit = "0.23"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
